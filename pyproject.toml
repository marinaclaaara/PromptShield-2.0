[project]
name = "promptshield"
version = "2.0.0"
description = "Detector de prompt injection (PT-BR/EN) com API FastAPI"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

# Os moldes de frase em data_builder.py são dados em linha longa: legibilidade > limite de colunas.
[tool.ruff.lint.per-file-ignores]
"promptshield/data_builder.py" = ["E501"]
