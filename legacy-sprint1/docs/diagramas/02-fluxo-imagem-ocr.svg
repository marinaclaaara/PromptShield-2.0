family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">ALLOW · REVIEW · BLOCK</text><text x="1010.0" y="331.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">o arquivo original não é guardado</text><path d="M1010,180 L1010,220 L145,220 L145,260" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><text x="500" y="213" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#0f172a">saída do OCR</text><line x1="260" y1="310" x2="320" y2="310" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><line x1="550" y1="310" x2="610" y2="310" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><line x1="840" y1="310" x2="900" y2="310" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><text x="30" y="390" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#475569" font-style="italic">O arquivo original não é guardado além do necessário: só o texto extraído e os metadados (política de retenção em docs/governanca.md).</text><text x="30" y="410" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#475569" font-style="italic">Texto de baixo contraste: o pré-processamento gera uma 2ª versão (invertida/equalizada); o OCR roda nas duas e vale a de maior confiança.</text></svg>