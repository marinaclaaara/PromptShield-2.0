<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="560" viewBox="0 0 1150 560"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#475569"/></marker></defs><rect width="1150" height="560" fill="#ffffff"/><text x="575.0" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">Avaliação por LLM e revisão humana (portal)</text><rect x="30" y="90" width="190" height="100" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="125.0" y="127.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Análises registradas</text><text x="125.0" y="144.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">ALLOW, REVIEW e BLOCK</text><text x="125.0" y="161.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">ainda não avaliadas</text><rect x="260" y="90" width="200" height="100" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="360.0" y="128.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Lote (diário ou sob demanda)</text><text x="360.0" y="144.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#334155">Batch API do provedor</text><text x="360.0" y="160.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#334155">ou API normal na demo</text><rect x="500" y="90" width="220" height="100" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/><text x="610.0" y="127.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">LLM avaliador</text><text x="610.0" y="144.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">texto delimitado como DADO</text><text x="610.0" y="161.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">resposta JSON: rótulo + justificativa</text><rect x="760" y="90" width="190" height="100" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/><text x="855.0" y="127.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Compara com o modelo</text><text x="855.0" y="144.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">acerto, falso positivo</text><text x="855.0" y="161.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">ou falso negativo</text><line x1="220" y1="140" x2="260" y2="140" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><line x1="460" y1="140" x2="500" y2="140" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><line x1="720" y1="140" x2="760" y2="140" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><rect x="990" y="90" width="140" height="100" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="1060.0" y="128.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Sem valor de treino</text><text x="1060.0" y="144.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#334155">vazias, repetidas,</text><text x="1060.0" y="160.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#334155">saudações</text><line x1="950" y1="140" x2="990" y2="140" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="520" y="290" width="230" height="90" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="635.0" y="322.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Concordam</text><text x="635.0" y="339.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">rótulo final aceito</text><text x="635.0" y="356.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">origem: modelo + LLM</text><rect x="790" y="290" width="230" height="90" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="905.0" y="322.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Divergem</text><text x="905.0" y="339.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">sinalizado no portal</text><text x="905.0" y="356.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">analista decide o rótulo final</text><path d="M855,190 L855,240 L635,240 L635,290" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><path d="M855,240 L905,240 L905,290" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><rect x="790" y="430" width="230" height="70" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/><text x="905.0" y="461.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Rótulo final do analista</text><text x="905.0" y="478.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">origem: humano</text><line x1="905" y1="380" x2="905" y2="430" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="290" width="440" height="210" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4"/><text x="45" y="314" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#0f172a">O que o painel calcula com os rótulos finais:</text><text x="45" y="342" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">• percentual de acertos, precision, recall e F1-score</text><text x="45" y="364" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">• matriz de confusão, por versão do modelo</text><text x="45" y="386" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">• desempenho por source_type e por idioma</text><text x="45" y="408" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">• quantas análises foram rotuladas por modelo + LLM,</text><text x="45" y="430" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">  quantas por humano e quantas aguardam revisão</text><text x="45" y="452" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">• exportação CSV e JSON só do que tem rótulo final</text><path d="M790,465 L520,465 L470,465" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 4"/><text x="530" y="458" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#0f172a">entram na exportação para retreino</text><text x="30" y="540" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#475569" font-style="italic">Proteção: o LLM avaliador trata o texto analisado como dado, nunca como instrução, e responde em formato estruturado.</text></svg>