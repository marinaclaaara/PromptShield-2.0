<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="470" viewBox="0 0 1150 470"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#475569"/></marker></defs><rect width="1150" height="470" fill="#ffffff"/><text x="575.0" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">Plano do dataset PT-BR</text><rect x="30" y="70" width="240" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="150.0" y="92.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Datasets públicos</text><text x="150.0" y="109.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">ex.: deepset/prompt-injections</text><text x="150.0" y="126.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">traduzido (licença conferida)</text><rect x="30" y="160" width="240" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="150.0" y="182.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Exemplos próprios</text><text x="150.0" y="199.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">e-mails, páginas, documentos</text><text x="150.0" y="216.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">escritos pelo grupo</text><rect x="30" y="250" width="240" height="70" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/><text x="150.0" y="272.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Sintéticos com IA Generativa</text><text x="150.0" y="289.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">ataques + hard negatives</text><text x="150.0" y="306.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">revisão humana obrigatória</text><rect x="30" y="340" width="240" height="70" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="150.0" y="362.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Hard negatives</text><text x="150.0" y="379.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">textos legítimos com palavras</text><text x="150.0" y="396.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">parecidas com as de ataque</text><rect x="330" y="150" width="220" height="190" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/><text x="440.0" y="198.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Limpeza</text><text x="440.0" y="215.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">normalizar texto</text><text x="440.0" y="232.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">remover duplicatas</text><text x="440.0" y="249.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">marcar origem do dado</text><text x="440.0" y="266.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">(público / próprio / sintético)</text><text x="440.0" y="283.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">rótulo: ataque ou legítimo</text><text x="440.0" y="300.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">(tipo de ataque opcional)</text><path d="M270,105 L300,105 L300,245 L330,245" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><path d="M270,195 L300,195 L300,245 L330,245" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><path d="M270,285 L300,285 L300,245 L330,245" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><path d="M270,375 L300,375 L300,245 L330,245" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><rect x="610" y="150" width="220" height="190" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="720.0" y="198.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Divisão</text><text x="720.0" y="215.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">treino 70%</text><text x="720.0" y="232.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">validação 15%</text><text x="720.0" y="249.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">teste 15%</text><text x="720.0" y="266.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">sem repetir exemplos entre</text><text x="720.0" y="283.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">conjuntos; hard negatives</text><text x="720.0" y="300.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">também em conjunto separado</text><line x1="550" y1="245" x2="610" y2="245" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><rect x="890" y="100" width="230" height="80" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/><text x="1005.0" y="136.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Baselines</text><text x="1005.0" y="153.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">regras · TF-IDF</text><rect x="890" y="205" width="230" height="80" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/><text x="1005.0" y="241.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Modelo profundo</text><text x="1005.0" y="258.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">DeBERTa + LoRA</text><rect x="890" y="310" width="230" height="80" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="1005.0" y="346.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Avaliação final</text><text x="1005.0" y="363.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">só no teste, uma vez por versão</text><path d="M830,245 L860,245 L860,140 L890,140" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><path d="M830,245 L890,245" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><path d="M830,245 L860,245 L860,350 L890,350" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><text x="30" y="440" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#475569" font-style="italic">Todo exemplo sintético carrega a marca origem = sintético. Exemplos gerados para red teaming ficam fora do conjunto de teste.</text><text x="30" y="458" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#475569" font-style="italic">A Intelliway também testará a API com datasets próprios, não divulgados às equipes.</text></svg>