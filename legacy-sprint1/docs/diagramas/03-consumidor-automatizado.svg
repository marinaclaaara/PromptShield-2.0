<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="580" viewBox="0 0 1150 580"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#475569"/></marker></defs><rect width="1150" height="580" fill="#ffffff"/><text x="575.0" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">Consumidor automatizado: robô de caixa de entrada</text><rect x="30" y="90" width="170" height="90" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="115.0" y="131.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Caixa de entrada</text><text x="115.0" y="148.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">novo e-mail chega</text><rect x="230" y="90" width="190" height="90" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="325.0" y="122.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Robô lê o e-mail</text><text x="325.0" y="139.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">corpo, rodapé, anexos</text><text x="325.0" y="156.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">(texto oculto incluso)</text><rect x="450" y="90" width="190" height="90" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="545.0" y="122.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Monta a requisição</text><text x="545.0" y="139.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">text + source_type = EMAIL</text><text x="545.0" y="156.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">metadata (id do e-mail)</text><rect x="670" y="90" width="190" height="90" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="765.0" y="122.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">POST /v1/analyze</text><text x="765.0" y="139.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">Bearer token</text><text x="765.0" y="156.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">timeout curto</text><line x1="200" y1="135" x2="230" y2="135" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><line x1="420" y1="135" x2="450" y2="135" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><line x1="640" y1="135" x2="670" y2="135" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><polygon points="1010,60 1130,135 1010,210 890,135" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="1010" y="131" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">decisão da API</text><text x="1010" y="149" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#0f172a">ALLOW / REVIEW / BLOCK</text><line x1="860" y1="135" x2="890" y2="135" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><rect x="300" y="330" width="230" height="90" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="415.0" y="362.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">ALLOW</text><text x="415.0" y="379.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">o robô segue o fluxo</text><text x="415.0" y="396.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">e repassa ao agente</text><rect x="560" y="330" width="230" height="90" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/><text x="675.0" y="362.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">REVIEW</text><text x="675.0" y="379.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">o robô retém o e-mail para</text><text x="675.0" y="396.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">revisão (política do consumidor)</text><rect x="820" y="330" width="230" height="90" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="935.0" y="362.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">BLOCK</text><text x="935.0" y="379.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">o robô descarta ou retém</text><text x="935.0" y="396.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">o e-mail e não repassa</text><path d="M1010,210 L1010,270 L415,270 L415,330" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1010,270 L675,270 L675,330" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1010,270 L935,270 L935,330" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="330" width="230" height="90" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="145.0" y="362.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Falha ou timeout da API</text><text x="145.0" y="379.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">política do consumidor:</text><text x="145.0" y="396.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155">reter (equivale a REVIEW)</text><path d="M765,180 L765,300 L145,300 L145,330" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="780" y="240" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#0f172a">sem resposta</text><text x="30" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569" font-style="italic">A API só sinaliza a decisão; quem decide o que fazer é o consumidor. Nem todo BLOCK é igualmente perigoso em qualquer contexto.</text><text x="30" y="492" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569" font-style="italic">Exemplo do cenário de aceitação: e-mail com instrução oculta no corpo → BLOCK; o robô retém e o evento aparece no portal pelo trace_id.</text><text x="30" y="514" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569" font-style="italic">Variações do mesmo robô: ler uma página web (source_type = WEB) ou um documento (DOCUMENT), consultando a API antes de processar.</text></svg>