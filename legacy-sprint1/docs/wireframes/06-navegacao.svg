<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="560" viewBox="0 0 1150 560"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#475569"/></marker></defs><rect width="1150" height="560" fill="#ffffff"/><text x="575.0" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">Wireframe 6: Navegação e dados consumidos</text><rect x="30" y="120" width="180" height="90" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="120.0" y="170.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Login</text><rect x="30" y="230" width="180" height="44" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="120.0" y="255.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#0f172a">autenticação por token</text><line x1="120" y1="210" x2="120" y2="230" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 4"/><rect x="240" y="120" width="180" height="90" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="330.0" y="170.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Painel</text><rect x="240" y="230" width="180" height="44" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="330.0" y="255.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#0f172a">métricas por versão</text><line x1="330" y1="210" x2="330" y2="230" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 4"/><rect x="450" y="120" width="180" height="90" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="540.0" y="170.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Histórico</text><rect x="450" y="230" width="180" height="44" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="540.0" y="255.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#0f172a">lista + filtros</text><line x1="540" y1="210" x2="540" y2="230" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 4"/><rect x="660" y="120" width="180" height="90" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="750.0" y="170.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Detalhe</text><rect x="660" y="230" width="180" height="44" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="750.0" y="255.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#0f172a">texto, LLM, rótulo</text><line x1="750" y1="210" x2="750" y2="230" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 4"/><rect x="870" y="120" width="180" height="90" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="960.0" y="170.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Exportar</text><rect x="870" y="230" width="180" height="44" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="960.0" y="255.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#0f172a">CSV e JSON</text><line x1="960" y1="210" x2="960" y2="230" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 4"/><line x1="210" y1="165" x2="240" y2="165" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><line x1="420" y1="165" x2="450" y2="165" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><line x1="630" y1="165" x2="660" y2="165" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><rect x="660" y="320" width="180" height="80" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/><text x="750.0" y="347.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Revisão</text><text x="750.0" y="365.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#334155">fila de divergências</text><text x="750.0" y="383.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#334155">modelo × LLM</text><line x1="750" y1="274" x2="750" y2="320" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><text x="760" y="300" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#0f172a">abre a revisão</text><text x="240" y="330" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#0f172a">Atalho: o contador de análises aguardando</text><text x="240" y="344" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#0f172a">revisão no painel leva direto à fila de Revisão.</text><rect x="30" y="440" width="1090" height="100" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="45" y="465" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#0f172a">Como o portal consome os dados:</text><text x="45" y="487" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#0f172a">O portal pertence ao serviço e lê o mesmo registro das análises gravado pela API. Todas as telas exigem login (token de sessão).</text><text x="45" y="505" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#0f172a">O menu lateral liga Painel, Histórico, Revisão e Exportar. A revisão grava o rótulo final com a origem (humano) e a exportação gera CSV/JSON.</text><text x="45" y="523" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#0f172a">O portal também dispara a avaliação por LLM em lote (sob demanda ou agendada).</text></svg>